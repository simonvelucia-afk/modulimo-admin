# Déploiement des Edge Functions du projet Central, depuis l'onglet Actions.
#
# Lancement : Actions → « Déployer les fonctions Supabase » → Run workflow,
# puis choisir la fonction.
#
# Prérequis (une seule fois) : un jeton personnel Supabase
# (supabase.com → Account → Access Tokens) enregistré dans
# Settings → Secrets and variables → Actions sous le nom
# SUPABASE_ACCESS_TOKEN.
#
# La CLI lit supabase/config.toml : verify_jwt reste à false pour les
# fonctions qui vérifient elles-mêmes leurs jetons (finance-bridge,
# formulaires publics). Les secrets des fonctions (FINANCE_SERVICE_ROLE_KEY,
# RESEND_KEY…) restent ceux déjà configurés dans Supabase.

name: Déployer les fonctions Supabase

on:
  workflow_dispatch:
    inputs:
      fonction:
        description: Fonction à déployer
        type: choice
        required: true
        default: finance-bridge
        options:
          - finance-bridge
          - submit-lead-pointe-est
          - submit-candidature
          - loi25-process
          - finance-sync
          - send-email

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: bpxscgrbxjscicpnheep

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # finance-bridge porte les soldes : on ne la déploie que si ses
      # tests passent.
      - name: Installer Deno
        if: inputs.fonction == 'finance-bridge'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tester finance-bridge
        if: inputs.fonction == 'finance-bridge'
        working-directory: supabase/functions/finance-bridge
        run: deno test --allow-env --allow-net --no-check tests/ lib/

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer ${{ inputs.fonction }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent : Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase functions deploy "${{ inputs.fonction }}" --project-ref "$PROJECT_REF"
